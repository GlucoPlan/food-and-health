name: Build & Release APK

# ТЗ 8.1: каждый push в main — новая версия, тесты, подписанный APK, GitHub Release.
on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

# Два push подряд не должны одновременно увеличивать версию
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Increment VERSION_PATCH
        id: version
        run: |
          MAJOR=$(grep VERSION_MAJOR version.properties | cut -d= -f2 | tr -d '[:space:]')
          MINOR=$(grep VERSION_MINOR version.properties | cut -d= -f2 | tr -d '[:space:]')
          PATCH=$(grep VERSION_PATCH version.properties | cut -d= -f2 | tr -d '[:space:]')
          NEW_PATCH=$((PATCH + 1))
          sed -i "s/VERSION_PATCH=.*/VERSION_PATCH=$NEW_PATCH/" version.properties
          echo "version=$MAJOR.$MINOR.$NEW_PATCH" >> "$GITHUB_OUTPUT"
          echo "tag=v$MAJOR.$MINOR.$NEW_PATCH" >> "$GITHUB_OUTPUT"
          echo "Version: $MAJOR.$MINOR.$NEW_PATCH"

      - name: Commit version.properties
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add version.properties
          git commit -m "ci: версия ${{ steps.version.outputs.version }} [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@v4.7.0
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Unit tests
        run: ./gradlew testReleaseUnitTest

      # Схема Room генерируется при сборке. В релиз не должна попасть версия базы,
      # JSON-схемы которой нет в репозитории: по ней пишутся тесты миграций.
      - name: Check Room schema is committed
        id: schema
        run: |
          CHANGES=$(git status --porcelain app/schemas)
          if [ -n "$CHANGES" ]; then
            echo "$CHANGES"
            echo "::error::Схема Room не закоммичена. Скачайте artifact room-schemas и закоммитьте app/schemas."
            exit 1
          fi

      - name: Upload Room schema
        if: failure() && steps.schema.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: room-schemas
          path: app/schemas

      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > app/keystore.jks

      - name: Build signed APK
        run: ./gradlew assembleRelease
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Rename and verify APK
        id: apk
        run: |
          APK="FoodHealth_${{ steps.version.outputs.version }}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$APK"
          BUILD_TOOLS=$(ls "$ANDROID_SDK_ROOT/build-tools/" | sort -V | tail -1)
          "$ANDROID_SDK_ROOT/build-tools/$BUILD_TOOLS/apksigner" verify --print-certs "$APK"
          echo "file=$APK" >> "$GITHUB_OUTPUT"

      - name: Remove keystore
        if: always()
        run: rm -f app/keystore.jks

      - name: Release notes
        # Все коммиты с прошлого релиза (checkout с fetch-depth: 0 приносит теги)
        run: bash .github/scripts/release_notes.sh "$GITHUB_SHA" > release_notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2.2.1
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ steps.commit.outputs.sha }}
          name: "Еда и здоровье ${{ steps.version.outputs.version }}"
          body_path: release_notes.md
          files: ${{ steps.apk.outputs.file }}
